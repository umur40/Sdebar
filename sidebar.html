<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fonksiyonel Responsive Sidebar Menü</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* CSS Değişkenleri */
    :root {
      --sidebar-width: 250px;
      --sidebar-collapsed-width: 60px;
      --sidebar-bg-color: #2c3e50;
      --sidebar-hover-color: #34495e;
      --sidebar-active-color: #2980b9;
      --text-color: #ecf0f1;
      --transition-speed: 0.3s;
      --shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    /* Genel Ayarlar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      min-height: 100vh;
      background: #f4f4f4;
      color: #333;
      line-height: 1.6;
    }

    /* Sidebar Stili */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--sidebar-bg-color);
      color: var(--text-color);
      transition: all var(--transition-speed) ease;
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: var(--shadow);
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }

    .sidebar-header {
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      white-space: nowrap;
      transition: opacity var(--transition-speed);
    }

    .sidebar.collapsed .logo {
      opacity: 0;
      width: 0;
    }

    .sidebar ul {
      list-style: none;
      padding: 1rem 0;
    }

    .sidebar ul li {
      position: relative;
    }

    .sidebar ul li a {
      text-decoration: none;
      color: var(--text-color);
      display: flex;
      align-items: center;
      padding: 0.8rem 1.5rem;
      transition: all 0.2s;
    }

    .sidebar ul li:hover {
      background-color: var(--sidebar-hover-color);
    }

    .sidebar ul li.active {
      background-color: var(--sidebar-active-color);
    }

    .sidebar .icon {
      margin-right: 10px;
      width: 20px;
      text-align: center;
      font-size: 1.1rem;
    }

    .sidebar .text {
      transition: opacity var(--transition-speed);
      white-space: nowrap;
    }

    .sidebar.collapsed .text {
      opacity: 0;
      width: 0;
    }

    /* Submenu */
    .submenu {
      display: none;
      background-color: rgba(0, 0, 0, 0.1);
      padding-left: 0;
      overflow: hidden;
      transition: all var(--transition-speed);
    }

    .submenu li {
      padding: 0;
    }

    .submenu li a {
      padding-left: 3rem !important;
    }

    .sidebar ul li.open > .submenu {
      display: block;
    }

    /* İçerik Alanı */
    .main-content {
      margin-left: var(--sidebar-width);
      padding: 2rem;
      flex: 1;
      transition: margin-left var(--transition-speed);
      background-color: #fff;
    }

    .collapsed + .main-content {
      margin-left: var(--sidebar-collapsed-width);
    }

    /* Tooltip */
    .sidebar.collapsed li:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }

    .tooltip {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      background-color: var(--sidebar-bg-color);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      white-space: nowrap;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 1001;
      box-shadow: var(--shadow);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo">Admin Panel</span>
      <button class="toggle-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
    </div>

    <ul id="menu">
      <!-- Dinamik Menü Elemanları Buraya JavaScript ile Eklenecek -->
    </ul>

    <div class="dark-mode-toggle">
      <span class="text">Koyu Mod</span>
      <label class="toggle-switch">
        <input type="checkbox" id="darkModeToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="main-content" id="main">
    <h1>Hoş Geldiniz</h1>
    <p>Responsive Sidebar Menü örneği.</p>
  </div>

  <script>
    const sidebar = document.getElementById("sidebar");
    const menu = document.getElementById("menu");
    const darkModeToggle = document.getElementById("darkModeToggle");

    // Sidebar'ı Açar/Kapatır
    function toggleSidebar() {
      sidebar.classList.toggle("collapsed");
    }

    // Menü Elemanlarını Dinamik Olarak Oluştur
    const menuItems = [
      { icon: "fas fa-home", text: "Anasayfa", link: "#" },
      {
        icon: "fas fa-cog",
        text: "Ayarlar",
        link: "#",
        submenu: [
          { icon: "fas fa-user", text: "Profil", link: "#" },
          { icon: "fas fa-lock", text: "Gizlilik", link: "#" },
        ]
      },
      { icon: "fas fa-file-alt", text: "Belgeler", link: "#" },
      { icon: "fas fa-chart-line", text: "Analizler", link: "#" }
    ];

    menuItems.forEach(item => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = item.link;
      a.innerHTML = `<i class="${item.icon} icon"></i><span class="text">${item.text}</span>`;
      li.appendChild(a);

      if (item.submenu) {
        const submenu = document.createElement("ul");
        submenu.classList.add("submenu");
        item.submenu.forEach(sub => {
          const subLi = document.createElement("li");
          const subA = document.createElement("a");
          subA.href = sub.link;
          subA.innerHTML = `<i class="${sub.icon} icon"></i><span class="text">${sub.text}</span>`;
          subLi.appendChild(subA);
          submenu.appendChild(subLi);
        });
        li.appendChild(submenu);
        li.onclick = () => li.classList.toggle("open");
      }

      menu.appendChild(li);
    });

    // Koyu Mod Geçişi
    darkModeToggle.addEventListener("change", () => {
      document.body.classList.toggle("dark-mode");
    });
  </script>
</body>
</html>
